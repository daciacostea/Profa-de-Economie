<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mulțumesc!</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background-color: #f8f9fa;
        color: #212529;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .thank-you-container {
        background-color: #fff;
        padding: 2rem 3rem;
        border-radius: 2xl;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        text-align: center;
        max-width: 500px;
      }

      .thank-you-container h1 {
        font-size: 2rem;
        color: #d63384; /* o nuanță apropiată de roz */
        margin-bottom: 1rem;
      }

      .thank-you-container p {
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }

      .thank-you-container a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #f8c9e9;
        color: #000;
        text-decoration: none;
        font-weight: bold;
        border-radius: 1rem;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        transition: background-color 0.3s ease;
      }

      .thank-you-container a:hover {
        background-color: #f3b1de;
      }
    </style>
  </head>
  <body>
    <div class="thank-you-container">
      <h1>Mulțumim pentru mesaj!</h1>
      <p>Îți vom răspunde în cel mai scurt timp posibil.</p>
      <a href="index.html">Înapoi la pagina principală</a>
    </div>
  </body>
</html>
